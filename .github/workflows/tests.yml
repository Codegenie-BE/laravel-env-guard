name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin framework matrix
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Run tests
        run: composer test

  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Apply proven Larastan fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/EnvGuard.php",
              "$first = $locations[0] ?? [];",
              "$first = $locations[0];",
          )

          for key in ("mtime", "ctime", "size", "ino"):
              replace_once(
                  "src/EnvGuard.php",
                  f"$stat['{key}'] ?? 0,",
                  f"$stat['{key}'],",
              )

          replace_once(
              "src/Scanners/EnvironmentFileScanner.php",
              "duplicates:list<array{key:string, lines:list<int>>>,",
              "duplicates:list<array{key:string, lines:list<int>}>,",
          )

          replace_once(
              "src/Scanners/PhpEnvironmentScanner.php",
              """            $tokens = token_get_all($contents);\n            $this->scanEnvHelpers($result, $tokens, $file, $inConfig);\n\n            $facade = $this->scanEnvFacade($tokens, $file, $inConfig);""",
              """            $tokens = token_get_all($contents);\n            $helpers = $this->scanEnvHelpers($tokens, $file, $inConfig);\n            $result['usages'] = array_merge($result['usages'], $helpers['usages']);\n            $result['dynamic'] = array_merge($result['dynamic'], $helpers['dynamic']);\n\n            $facade = $this->scanEnvFacade($tokens, $file, $inConfig);""",
          )

          replace_once(
              "src/Scanners/PhpEnvironmentScanner.php",
              """    /**\n     * @param  array{usages:list<array{key:string, path:string, line:int, in_config:bool, source:string}>, dynamic:list<array{path:string, line:int, in_config:bool, source:string}>, raw:list<array{key:string, path:string, line:int, source:string}>}  $result\n     * @param  array<int, array<int, mixed>|string>  $tokens\n     */\n    private function scanEnvHelpers(array &$result, array $tokens, string $file, bool $inConfig): void\n    {\n        foreach ($tokens as $index => $token) {""",
              """    /**\n     * @param  array<int, array<int, mixed>|string>  $tokens\n     * @return array{\n     *     usages:list<array{key:string, path:string, line:int, in_config:bool, source:string}>,\n     *     dynamic:list<array{path:string, line:int, in_config:bool, source:string}>\n     * }\n     */\n    private function scanEnvHelpers(array $tokens, string $file, bool $inConfig): array\n    {\n        $result = [\n            'usages' => [],\n            'dynamic' => [],\n        ];\n\n        foreach ($tokens as $index => $token) {""",
          )

          replace_once(
              "src/Scanners/PhpEnvironmentScanner.php",
              """            $this->recordEnvironmentCall($result, $tokens, $openIndex, $file, $token[2], $inConfig, 'env');\n        }\n    }\n\n    /**\n     * @param  array<int, array<int, mixed>|string>  $tokens""",
              """            $this->recordEnvironmentCall($result, $tokens, $openIndex, $file, $token[2], $inConfig, 'env');\n        }\n\n        return $result;\n    }\n\n    /**\n     * @param  array<int, array<int, mixed>|string>  $tokens""",
          )

          replace_once(
              "src/Scanners/PhpEnvironmentScanner.php",
              "/** @param array<int, array<int, mixed>|string> $tokens */\n    private function previousSignificant(array $tokens, int $index): array|string|null",
              "/**\n     * @param  array<int, array<int, mixed>|string>  $tokens\n     * @return array<int, mixed>|string|null\n     */\n    private function previousSignificant(array $tokens, int $index): array|string|null",
          )

          replace_once(
              "src/Scanners/PhpEnvironmentScanner.php",
              "    private function tokenIs(array|string $token, int $id): bool",
              "    /** @param array<int, mixed>|string $token */\n    private function tokenIs(array|string $token, int $id): bool",
          )

      - name: Apply formatting
        run: composer format

      - name: Static analysis
        run: composer analyse

      - name: Commit Larastan fixes
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Fix Larastan type issues"
            git push origin HEAD:${{ github.head_ref }}
          fi
