name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin framework matrix
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Run tests
        run: composer test

  quality:
    name: Quality gates / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Check formatting
        run: composer format:test

      - name: Static analysis
        run: composer analyse

      - name: Coverage
        run: composer test:coverage

  portability:
    name: Portability / ${{ matrix.os }} / PHP 8.5 / Laravel 13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:~13.0" "orchestra/testbench:~11.0" --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - compatibility
      - quality
      - portability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every required job succeeded or was intentionally skipped
        env:
          REQUIRED_RESULTS: ${{ toJson(needs) }}
        run: |
          if ! jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$REQUIRED_RESULTS"; then
            jq --raw-output 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$REQUIRED_RESULTS"
            exit 1
          fi

  required-ci-compatibility:
    name: Required CI
    if: always()
    needs:
      - ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Preserve the current ruleset check during migration
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
        run: test "$CI_GATE_RESULT" = "success"
