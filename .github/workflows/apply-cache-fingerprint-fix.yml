name: Apply reviewed cache fingerprint fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/deep-test-hardening-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fingerprint invalidation fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path.cwd()
          path = root / 'src' / 'EnvGuard.php'
          source = path.read_text(encoding='utf-8')

          old = (
              "        $parts[] = 'configuration|'.$this->behaviorConfigurationFingerprint();\n"
              "        $parts[] = 'runtime-presence|'.$this->runtimePresenceFingerprint();"
          )
          new = (
              "        $parts[] = 'configuration|'.$this->behaviorConfigurationFingerprint();\n"
              "        $parts[] = implode('|', [\n"
              "            'configuration-cache',\n"
              "            $this->app->configurationIsCached() ? 'cached' : 'uncached',\n"
              "            $this->normalizeComparablePath($this->app->getCachedConfigPath()),\n"
              "        ]);\n"
              "        $parts[] = 'runtime-presence|'.$this->runtimePresenceFingerprint();"
          )

          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one fingerprint insertion point, found {source.count(old)}.')
              path.write_text(source.replace(old, new, 1), encoding='utf-8', newline='\n')

          workflow = root / '.github' / 'workflows' / 'apply-cache-fingerprint-fix.yml'
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit reviewed source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit --message 'Invalidate guard cache on config cache transitions'
          git push origin HEAD:${{ github.head_ref }}
