name: Verify Packagist and clean branches

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-clean:
    name: Verify Packagist sync and clean branches
    runs-on: ubuntu-latest

    steps:
      - name: Verify Packagist auto-update
        id: packagist
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          package_url="https://packagist.org/packages/codegenie-be/laravel-env-guard.json"
          observed=""
          synced="false"

          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${package_url}?t=$(date +%s)")"
            observed="$(printf '%s' "$response" | jq -r '.package.versions["dev-main"].source.reference // empty')"

            if [ "$observed" = "$EXPECTED_SHA" ]; then
              synced="true"
              break
            fi

            sleep 5
          done

          echo "synced=$synced" >> "$GITHUB_OUTPUT"
          echo "observed=$observed" >> "$GITHUB_OUTPUT"

      - name: Delete every branch except main
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          auth_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          mapfile -t branches < <(
            curl --fail --silent --show-error "${auth_headers[@]}" "${api}/branches?per_page=100" |
              jq -r '.[].name'
          )

          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi

            curl --fail --silent --show-error \
              -X DELETE \
              "${auth_headers[@]}" \
              "${api}/git/refs/heads/${branch}"
          done

          remaining="$(
            curl --fail --silent --show-error "${auth_headers[@]}" "${api}/branches?per_page=100" |
              jq '[.[] | select(.name != "main")] | length'
          )"

          if [ "$remaining" = "0" ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Publish verification statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PACKAGIST_SYNCED: ${{ steps.packagist.outputs.synced }}
          PACKAGIST_OBSERVED: ${{ steps.packagist.outputs.observed }}
          BRANCHES_CLEAN: ${{ steps.branches.outputs.clean }}
          BRANCHES_REMAINING: ${{ steps.branches.outputs.remaining }}
        run: |
          set -euo pipefail

          status_url="https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}"
          auth_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
            -H "Content-Type: application/json"
          )

          if [ "$PACKAGIST_SYNCED" = "true" ]; then
            packagist_state="success"
            packagist_description="Packagist dev-main synchronized automatically"
          else
            packagist_state="failure"
            packagist_description="Packagist auto-update did not synchronize in time"
          fi

          if [ "$BRANCHES_CLEAN" = "true" ]; then
            branches_state="success"
            branches_description="Only main remains"
          else
            branches_state="failure"
            branches_description="${BRANCHES_REMAINING} non-main branch(es) remain"
          fi

          packagist_payload="$(jq -nc \
            --arg state "$packagist_state" \
            --arg context 'packagist/auto-update' \
            --arg description "$packagist_description" \
            '{state: $state, context: $context, description: $description}')"

          branches_payload="$(jq -nc \
            --arg state "$branches_state" \
            --arg context 'repository/branch-cleanup' \
            --arg description "$branches_description" \
            '{state: $state, context: $context, description: $description}')"

          curl --fail --silent --show-error -X POST "${auth_headers[@]}" \
            "$status_url" -d "$packagist_payload" > /dev/null

          curl --fail --silent --show-error -X POST "${auth_headers[@]}" \
            "$status_url" -d "$branches_payload" > /dev/null

          if [ "$PACKAGIST_SYNCED" != "true" ] || [ "$BRANCHES_CLEAN" != "true" ]; then
            echo "Packagist observed reference: ${PACKAGIST_OBSERVED}"
            exit 1
          fi
