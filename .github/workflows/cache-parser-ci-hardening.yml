name: cache-parser-ci-hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate reviewed hardening
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cache-parser-ci-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Apply reviewed patch
        run: |
          git apply --recount --check --exclude=README.md .github/cache-parser-ci-hardening.patch
          git apply --recount --exclude=README.md .github/cache-parser-ci-hardening.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = 'A metadata fingerprint is built from the scanned files. Sanitized findings are cached at:'
          new = 'A fingerprint is built from scanned-file metadata, behavior-affecting guard configuration, and the presence (never the values) of documented runtime environment keys. Sanitized findings are cached at:'
          if text.count(old) != 1:
              raise SystemExit('Unexpected README fingerprint paragraph')
          text = text.replace(old, new, 1)

          old = 'When the metadata fingerprint is unchanged, source files are not reparsed. The cache contains key names, finding metadata, paths, and line numbers only. It never contains environment values.'
          new = 'When that fingerprint is unchanged, source files are not reparsed. This also prevents stale cache reuse when an externally supplied environment key appears or disappears between application boots. The cache contains key names, finding metadata, paths, and line numbers only. It never contains environment values.'
          if text.count(old) != 1:
              raise SystemExit('Unexpected README cache paragraph')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: composer format

      - name: Static analysis
        run: composer analyse

      - name: Validate package
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Tests and coverage
        run: composer test:coverage

      - name: Commit validated changes
        run: |
          git show origin/main:composer.json > composer.json
          rm .github/cache-parser-ci-hardening.patch
          rm .github/workflows/cache-parser-ci-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden cache invalidation and dotenv parsing"
          git push origin HEAD:agent/cache-parser-ci-hardening
