name: hardening-observable

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    name: Apply reviewed hardening
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Apply reviewed hardening
        run: python .github/hardening.py

      - name: Format
        run: composer format

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

      - name: Coverage
        run: composer test:coverage

      - name: Restore permanent CI and commit
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm .github/workflows/hardening-observable.yml .github/hardening.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden environment analysis and coverage"
          git push origin HEAD:agent/codebase-hardening
