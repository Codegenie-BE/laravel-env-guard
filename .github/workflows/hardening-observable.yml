name: hardening-observable

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    name: Apply reviewed hardening
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Normalize temporary patch escapes
        shell: python
        run: |
          from pathlib import Path

          file = Path('.github/hardening.py')
          text = file.read_text()
          old = '''    count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} match(es) in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, expected))'''.replace('              ', '    ')
          new = '''    count = text.count(old)
              if count != expected:
                  slash = chr(92)
                  escaped_old = old.replace(slash, slash * 2)
                  escaped_new = new.replace(slash, slash * 2)
                  escaped_count = text.count(escaped_old)
                  if escaped_count == expected:
                      old = escaped_old
                      new = escaped_new
                      count = escaped_count
              if count != expected:
                  raise SystemExit(f"Expected {expected} match(es) in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, expected))'''.replace('              ', '    ')

          if old not in text:
              raise SystemExit('Unable to locate temporary replace_once implementation')

          file.write_text(text.replace(old, new, 1))

      - name: Apply reviewed hardening
        run: python .github/hardening.py

      - name: Bind config in core test application
        shell: python
        run: |
          from pathlib import Path

          file = Path('tests/Feature/EnvGuardTest.php')
          text = file.read_text()
          text = text.replace(
              'use Illuminate\\Foundation\\Application;\n',
              'use Illuminate\\Config\\Repository;\nuse Illuminate\\Foundation\\Application;\n',
              1,
          )
          text = text.replace(
              '    $app = new Application($root);\n',
              "    $app = new Application($root);\n    $app->instance('config', new Repository);\n",
              1,
          )
          file.write_text(text)

      - name: Format
        run: composer format

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

      - name: Coverage
        run: composer test:coverage

      - name: Restore permanent CI and commit
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm .github/workflows/hardening-observable.yml .github/hardening.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden environment analysis and coverage"
          git push origin HEAD:agent/codebase-hardening
