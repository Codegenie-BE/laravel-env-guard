name: Finalize stateless audits

on:
  push:
    branches:
      - refactor/stateless-audits

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@e9c34d20ec4210b7388f809c9331027f020a1fdc # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Finalize implementation and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Expected {label} text was not found')
              return text.replace(old, new, 1)

          # Finalize EnvGuard itself: every call scans current files and removes any
          # orphaned v1.1 cache left behind by an upgrade.
          path = Path('src/EnvGuard.php')
          text = path.read_text()
          old = '''    /**
           * Inspect the current project state from disk.
           *
           * The legacy fresh/fingerprint fields remain for 1.x API compatibility,
           * but no persistent result cache is read or written.
           *
           * @return array{findings:list<array<string, mixed>>, fresh:bool, fingerprint:string}
           */
          public function inspect(): array
          {
              $findings = $this->scan($this->collectSourceFiles(), $this->environmentPaths());

              return [
                  'findings' => $findings,
                  'fresh' => true,
                  'fingerprint' => hash('sha256', serialize($findings)),
              ];
          }
'''
          if old not in text:
              # The first mutation was syntactically valid but deliberately left for Pint.
              old = '''    /**
 * Inspect the current project state from disk.
 *
 * The legacy fresh/fingerprint fields remain for 1.x API compatibility,
 * but no persistent result cache is read or written.
 *
 * @return array{findings:list<array<string, mixed>>, fresh:bool, fingerprint:string}
 */
public function inspect(): array
{
    $findings = $this->scan($this->collectSourceFiles(), $this->environmentPaths());

    return [
        'findings' => $findings,
        'fresh' => true,
        'fingerprint' => hash('sha256', serialize($findings)),
    ];
}
'''
          new = '''    /**
     * Inspect the current project state from disk.
     *
     * The legacy fresh/fingerprint fields remain for 1.x API compatibility,
     * but no persistent result cache is read or written.
     *
     * @return array{findings:list<array<string, mixed>>, fresh:bool, fingerprint:string}
     */
    public function inspect(): array
    {
        $this->removeLegacyResultCache();
        $findings = $this->scan($this->collectSourceFiles(), $this->environmentPaths());

        return [
            'findings' => $findings,
            'fresh' => true,
            'fingerprint' => hash('sha256', serialize($findings)),
        ];
    }
'''
          text = replace_once(text, old, new, 'EnvGuard inspect block')

          anchor = '''    private function runtimeHas(string $key): bool
'''
          cleanup = '''    private function removeLegacyResultCache(): void
    {
        $paths = [
            $this->app->storagePath('framework/cache/laravel-env-guard.json'),
        ];
        $configured = config('env-guard.cache_path');

        if (is_string($configured) && $configured !== '') {
            $paths[] = $this->isAbsolutePath($configured)
                ? $configured
                : $this->app->basePath($configured);
        }

        foreach (array_unique($paths) as $path) {
            if (is_file($path)) {
                @unlink($path);
            }
        }
    }

'''
          if 'private function removeLegacyResultCache' not in text:
              text = replace_once(text, anchor, cleanup + anchor, 'runtimeHas anchor')
          path.write_text(text)

          # Make the no-persistent-state regression explicit and rename legacy cache wording.
          path = Path('tests/Feature/EnvGuardTest.php')
          text = path.read_text()
          old = '''    $guard = buildEnvGuard($this->root);
    $first = $guard->inspect();

    file_put_contents($this->root.'/app/Current.php', "<?php env('CURRENT_ONLY_KEY');\\n");
'''
          new = '''    mkdir($this->root.'/storage/framework/cache', 0777, true);
    $legacyCache = $this->root.'/storage/framework/cache/laravel-env-guard.json';
    file_put_contents($legacyCache, '{}');

    $guard = buildEnvGuard($this->root);
    $first = $guard->inspect();

    file_put_contents($this->root.'/app/Current.php', "<?php env('CURRENT_ONLY_KEY');\\n");
'''
          text = replace_once(text, old, new, 'stateless regression setup')
          text = replace_once(
              text,
              "        ->and(is_file($this->root.'/storage/env-guard.json'))->toBeFalse();",
              "        ->and(is_file($legacyCache))->toBeFalse();",
              'legacy cache assertion',
          )
          text = text.replace(
              "it('invalidates cached findings when runtime environment presence changes',",
              "it('observes runtime environment presence changes on the next inspection',",
          )
          text = text.replace(
              "it('invalidates cached findings when behavior configuration changes',",
              "it('observes behavior configuration changes on the next inspection',",
          )
          path.write_text(text)

          # README: document console-first and stateless behavior instead of cache reuse.
          path = Path('README.md')
          text = path.read_text()
          text = replace_once(
              text,
              'Laravel Env Guard automatically audits environment-variable usage while a Laravel application boots in development. It catches environment drift before it becomes a deployment problem, without requiring a command and without storing secret values.',
              'Laravel Env Guard automatically audits environment-variable usage during guarded Artisan boots in development. Every audit reads the current project files directly, catches environment drift before it becomes a deployment problem, and does not require a separate command or persistent findings cache.',
              'README introduction',
          )
          text = replace_once(
              text,
              'Errors fail fast in guarded development environments by default. Findings are logged when the scan result changes. During Artisan commands, current warnings and errors are also written to STDERR by default, even when the metadata scan result was reused from cache.',
              'Errors fail fast in guarded development environments by default. Every guarded audit reads the current project state and logs its findings. During Artisan commands, current warnings and errors are also written to STDERR by default.',
              'README findings behavior',
          )
          text = replace_once(
              text,
              "'environments' => [\n    'local',\n],\n\n'fail_on_error' => true,",
              "'environments' => [\n    'local',\n],\n\n'console_only' => true,\n\n'fail_on_error' => true,",
              'README automatic config block',
          )
          text = replace_once(
              text,
              'Production and staging therefore do no source scan by default.',
              'Production and staging therefore do no source scan by default. Normal HTTP requests are also skipped by default because `console_only` is `true`; set it to `false` only when intentionally opting into a full audit during non-console boots.',
              'README production paragraph',
          )
          text = replace_once(
              text,
              "Console output is intentionally independent from change-based logging. A cached finding therefore remains visible when you run another Artisan command, while Laravel's log file is not filled with the same warning on every boot.",
              'Each guarded Artisan boot performs a complete audit of the current relevant files before reporting. Findings are logged for that audit as well, so console and log output describe the same current project state without consulting a persistent scan result.',
              'README console cache paragraph',
          )
          performance_start = text.index('## Performance\n')
          performance_end = text.index('## Custom Laravel environment paths\n', performance_start)
          performance = '''## Performance

Every guarded audit reparses the current application-owned source and configured environment files. Laravel Env Guard does not persist findings or a source fingerprint between processes.

Automatic full-project scans are console-first by default, so ordinary HTTP requests do not repeatedly pay the static-analysis cost. Direct calls to `EnvGuard::inspect()` always inspect the current filesystem state.

The scan remains bounded: dependency/generated trees are pruned, symlink targets are ignored, and files above the configured size limit are skipped.

Change the maximum scanned file size if necessary:

```php
'max_file_size' => 1_048_576,
```

There is no `laravel-env-guard.json` result cache to clear. When upgrading from a version that created one, the next audit removes the legacy default cache file and any previously configured custom `cache_path`.

'''
          text = text[:performance_start] + performance + text[performance_end:]
          text = replace_once(
              text,
              "    'environments' => ['local'],\n    'fail_on_error' => true,",
              "    'environments' => ['local'],\n    'console_only' => true,\n    'fail_on_error' => true,",
              'README full config console_only',
          )
          text = text.replace("\n    'ignore_patterns' => [],\n    'cache_path' => null,\n", "\n    'ignore_patterns' => [],\n")
          old_long = "Laravel Env Guard runs when the Laravel application boots. Under Octane, a queue worker, Reverb, or another long-running process, that means the audit runs when that process starts. Reload/restart the process after changing source or environment files, just as you would for other boot-time configuration changes.\n\nConsole output applies only when Laravel is running in console mode."
          new_long = "With the default `console_only` setting, Laravel Env Guard runs when a guarded console process boots. That includes Artisan-started long-running processes such as queue workers, Reverb, and Octane startup, but normal HTTP request boots are skipped. Reload/restart a long-running process after changing source or environment files when you want its startup audit to run again.\n\nSet `console_only` to `false` only if your application deliberately wants automatic audits during non-console boots."
          text = replace_once(text, old_long, new_long, 'README long-running section')
          for forbidden in [
              'storage/framework/cache/laravel-env-guard.json',
              'reused from cache',
              'cached finding',
              "'cache_path' => null",
          ]:
              if forbidden in text:
                  raise SystemExit(f'Legacy README cache wording remained: {forbidden}')
          path.write_text(text)

          # Scenario model: preserve scenario structure while replacing result-cache semantics.
          path = Path('docs/scenarios.md')
          text = path.read_text()
          text = replace_once(
              text,
              "- the guard runs when `app()->environment()` is `local`;\n- no custom Artisan command is required;\n- deterministic errors can fail fast;\n- findings are logged when the scan result changes;\n- current findings are written to STDERR during guarded Artisan commands.",
              "- the guard runs when `app()->environment()` is `local`;\n- automatic full-project scans are console-first through `console_only`;\n- no custom Artisan command is required;\n- deterministic errors can fail fast;\n- every audit reads current project files and logs its findings;\n- current findings are written to STDERR during guarded Artisan commands.",
              'scenario normal-development bullets',
          )
          text = replace_once(
              text,
              'Production, staging, and testing are not scanned unless explicitly added to `env-guard.environments`.',
              'Production, staging, and testing are not scanned unless explicitly added to `env-guard.environments`. Normal HTTP request boots are skipped while `console_only` remains enabled.',
              'scenario environment paragraph',
          )
          old_console = '''Console reporting is intentionally independent from the scan cache. Cached findings therefore remain visible on later Artisan commands.

Laravel log output remains change-based: findings are logged only when the scan result is fresh. This keeps the log useful without repeating the same warning on every command.

Set `console_output` to `false` to disable this presentation layer without disabling the audit.'''
          new_console = '''Every guarded Artisan boot performs a complete audit of the current relevant source and environment files. The same current findings are written to Laravel logging for that audit, and the console report is rendered without consulting persistent scan state.

Set `console_output` to `false` to disable the STDERR presentation layer without disabling the audit or Laravel logging.'''
          text = replace_once(text, old_console, new_console, 'scenario console section')
          text = replace_once(
              text,
              'The metadata fingerprint includes the Laravel configuration-cache state and the active cache path.',
              'Each audit reads Laravel\'s current configuration-cache state directly, so `config:cache` and `config:clear` transitions are observed without invalidating persistent Env Guard state.',
              'scenario config-cache state',
          )
          old_workers = '''The guard runs when the Laravel application boots. With Octane, queue workers, Reverb, or another long-running process, that means the scan runs when the worker/application starts rather than on every handled request. Restart/reload the worker after environment or source changes, as required for other boot-time configuration changes.'''
          new_workers = '''With `console_only` enabled by default, automatic audits run on guarded console boots, including Artisan-started long-running processes such as queue workers, Reverb, and Octane startup. Normal HTTP request boots do not trigger a full source scan. Restart/reload a long-running process after source or environment changes when you want its startup audit to run again.'''
          text = replace_once(text, old_workers, new_workers, 'scenario long-running processes')
          old_perf = '''Source analysis is limited to application-owned paths, configured project files and a configurable maximum file size. Explicit extensionless text files such as `Dockerfile` are supported, while binary files in configured project directories are skipped. Shell-style infrastructure references such as `${APP_NAME:-Laravel}` are recognized when the key belongs to the project.

The result cache stores a metadata fingerprint plus sanitized findings. On the next Laravel bootstrap, unchanged metadata reuses the prior result instead of reparsing source files.

The optional Laravel-key policy feeds its inactive exact-key set into the normal ignore-key configuration before inspection. Because ignore-key configuration participates in the fingerprint, a key becoming active or inactive invalidates an incompatible cached result.

Symlinked files are not followed by default, preventing accidental traversal outside the project tree.'''
          new_perf = '''Source analysis is limited to application-owned paths, configured project files and a configurable maximum file size. Explicit extensionless text files such as `Dockerfile` are supported, while binary files in configured project directories are skipped. Shell-style infrastructure references such as `${APP_NAME:-Laravel}` are recognized when the key belongs to the project.

Every audit reparses the current relevant files and does not persist findings or a source fingerprint between processes. `console_only` keeps this deterministic full scan off ordinary HTTP requests by default.

The optional Laravel-key policy feeds its inactive exact-key set into the normal ignore-key configuration before each inspection, so a key becoming active or inactive is evaluated immediately.

Symlinked files are not followed by default, preventing accidental traversal outside the project tree.'''
          text = replace_once(text, old_perf, new_perf, 'scenario performance section')
          text = replace_once(
              text,
              'No finding should ever contain an environment value. Console output, exception messages, logs and the metadata cache contain only key names, finding codes, paths, line numbers and sanitized diagnostic text.\n\nThis invariant is part of the package\'s security contract.',
              'No finding should ever contain an environment value. Console output, exception messages, and logs contain only key names, finding codes, paths, line numbers and sanitized diagnostic text. Env Guard does not persist a findings cache.\n\nThis invariant is part of the package\'s security contract.',
              'scenario security section',
          )
          text = replace_once(
              text,
              '- configuration-cache transitions invalidate the metadata cache correctly.',
              '- configuration-cache transitions are observed directly by subsequent audits without persistent scan state.',
              'scenario E2E contract',
          )
          for forbidden in ['metadata cache', 'result cache', 'scan cache', 'participates in the fingerprint']:
              if forbidden in text:
                  raise SystemExit(f'Legacy scenario cache wording remained: {forbidden}')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format and validate
        run: |
          set -euo pipefail
          composer format
          composer check:all
          php -l tests/E2E/runner.php
          test ! -f storage/framework/cache/laravel-env-guard.json

      - name: Remove temporary workflow and publish finalized refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-stateless-audits.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize stateless Env Guard audits'
          git push origin HEAD:refactor/stateless-audits
