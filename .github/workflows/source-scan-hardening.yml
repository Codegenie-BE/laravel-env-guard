name: source-scan-hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Apply and validate reviewed hardening
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/source-scan-comment-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Apply reviewed changes
        run: |
          python .github/source-scan-hardening.py
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/Unit/TextEnvironmentScannerTest.php')
          lines = test.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'file_put_contents($compose, "# COMMENTED_INFRA:' in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected one compose fixture line, found {len(matches)}')

          index = matches[0]
          replacement = [
              "    file_put_contents($compose, <<<'YAML'",
              '# COMMENTED_INFRA: ${COMMENTED_INFRA}',
              'services:',
              '  app:',
              '    environment:',
              '      REAL_INFRA: ${REAL_INFRA}',
              '      LABEL: "#${QUOTED_INFRA}"',
              'YAML);',
          ]
          lines[index:index + 1] = replacement
          test.write_text('\n'.join(lines) + '\n')

          guard = Path('src/EnvGuard.php')
          text = guard.read_text()
          old = '    private function sourceFilesIn(string $directory): RecursiveIteratorIterator\n'
          new = '    /** @return iterable<int|string, SplFileInfo> */\n    private function sourceFilesIn(string $directory): iterable\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sourceFilesIn signature, found {text.count(old)}')
          guard.write_text(text.replace(old, new, 1))
          PY

      - name: Syntax check generated PHP
        run: |
          php -l tests/Unit/TextEnvironmentScannerTest.php
          php -l src/EnvGuard.php
          php -l src/Scanners/PhpEnvironmentScanner.php
          php -l src/Scanners/TextEnvironmentScanner.php

      - name: Format
        run: composer format

      - name: Static analysis
        run: composer analyse

      - name: Validate package
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Tests and coverage
        run: composer test:coverage

      - name: Commit validated non-workflow changes
        run: |
          git show origin/main:composer.json > composer.json
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm .github/source-scan-hardening.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden source scanning and comment handling"
          git push origin HEAD:agent/source-scan-comment-hardening
