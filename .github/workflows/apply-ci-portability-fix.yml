name: Apply CI portability fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/deep-test-hardening-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make Composer constraints shell-portable
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path.cwd()
          path = root / '.github' / 'workflows' / 'tests.yml'
          source = path.read_text(encoding='utf-8')
          caret_count = source.count('^')

          if caret_count != 42:
              raise SystemExit(f'Expected 42 Composer caret constraints, found {caret_count}.')

          path.write_text(source.replace('^', '~'), encoding='utf-8', newline='\n')
          (root / '.github' / 'workflows' / 'apply-ci-portability-fix.yml').unlink(missing_ok=True)
          PY

      - name: Commit reviewed CI portability fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit --message 'Make Composer CI constraints portable across shells'
          git push origin HEAD:${{ github.head_ref }}
