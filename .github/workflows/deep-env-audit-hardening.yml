name: deep-env-audit-hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Apply and validate reviewed hardening
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/deep-env-audit-hardening
          fetch-depth: 0

      - name: Detect reviewed payload
        id: payload
        run: |
          if [ -d .github/hardening ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and apply reviewed changes
        if: steps.payload.outputs.apply == 'true'
        run: |
          cat .github/hardening/core.py.part* > /tmp/apply-core.py
          cat .github/hardening/tests.py.part* > /tmp/apply-tests.py
          python -m py_compile /tmp/apply-core.py /tmp/apply-tests.py
          python /tmp/apply-core.py
          python /tmp/apply-tests.py
          python - <<'PY'
          from pathlib import Path

          guard = Path('src/EnvGuard.php')
          text = guard.read_text()
          old = "                    $first['path'] ?? null,\n                    $first['line'] ?? null,"
          new = "                    $first['path'],\n                    $first['line'],"

          if text.count(old) != 1:
              raise SystemExit(f'Expected one typed finding location, found {text.count(old)}')

          guard.write_text(text.replace(old, new, 1))

          scanner = Path('src/Scanners/TextEnvironmentScanner.php')
          text = scanner.read_text()
          old = r'''        if ($this->isInfrastructureFile($file) && ! $this->isJavaScriptFile($file)) {
              $contents = $this->maskPattern(
                  $contents,
                  '~([\'\"])(?:\\.|(?!\1).)*\1(*SKIP)(*F)|\#[^\r\n]*~',
              );
          }
          '''
          new = '''        if ($this->isInfrastructureFile($file) && ! $this->isJavaScriptFile($file)) {
              $contents = $this->maskInfrastructureComments($contents);
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f'Expected one infrastructure comment block, found {text.count(old)}')

          text = text.replace(old, new, 1)
          marker = '''    private function maskPattern(string $contents, string $pattern): string
          '''
          method = r'''    private function maskInfrastructureComments(string $contents): string
          {
              $masked = $contents;
              $quote = null;
              $length = strlen($contents);

              for ($index = 0; $index < $length; $index++) {
                  $character = $contents[$index];

                  if ($quote !== null) {
                      if ($character === '\\' && $quote === '"' && $index + 1 < $length) {
                          $index++;

                          continue;
                      }

                      if ($character === $quote) {
                          $quote = null;
                      }

                      continue;
                  }

                  if ($character === "'" || $character === '"') {
                      $quote = $character;

                      continue;
                  }

                  if ($character !== '#') {
                      continue;
                  }

                  while ($index < $length && $contents[$index] !== "\n" && $contents[$index] !== "\r") {
                      $this->maskByte($masked, $index);
                      $index++;
                  }

                  $index--;
              }

              return $masked;
          }

          '''

          if text.count(marker) != 1:
              raise SystemExit(f'Expected one maskPattern marker, found {text.count(marker)}')

          scanner.write_text(text.replace(marker, method + marker, 1))

          test = Path('tests/Unit/TextEnvironmentScannerTest.php')
          text = test.read_text()
          old = "    $path = tempnam(sys_get_temp_dir(), 'phpunit-');\n    file_put_contents($path, <<<'XML'\n"
          new = "    $root = sys_get_temp_dir().'/env-guard-phpunit-'.bin2hex(random_bytes(4));\n    mkdir($root, 0777, true);\n    $path = $root.'/phpunit.xml';\n    file_put_contents($path, <<<'XML'\n"

          if text.count(old) != 1:
              raise SystemExit(f'Expected one PHPUnit temporary path, found {text.count(old)}')

          text = text.replace(old, new, 1)
          old = "    expect($result['phpunit_keys'])->toBe(['REAL_ENV', 'REAL_SERVER']);\n\n    @unlink($path);\n});\n"
          new = "    expect($result['phpunit_keys'])->toBe(['REAL_ENV', 'REAL_SERVER']);\n\n    @unlink($path);\n    @rmdir($root);\n});\n"

          if text.count(old) != 1:
              raise SystemExit(f'Expected one PHPUnit cleanup block, found {text.count(old)}')

          test.write_text(text.replace(old, new, 1))
          PY

      - name: Setup PHP
        if: steps.payload.outputs.apply == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Laravel 13 development dependencies
        if: steps.payload.outputs.apply == 'true'
        run: |
          composer require --dev "laravel/framework:^13.0" "orchestra/testbench:^11.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Syntax check PHP
        if: steps.payload.outputs.apply == 'true'
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Format
        if: steps.payload.outputs.apply == 'true'
        run: composer format

      - name: Static analysis
        if: steps.payload.outputs.apply == 'true'
        run: composer analyse

      - name: Validate package
        if: steps.payload.outputs.apply == 'true'
        run: composer validate --strict

      - name: Audit dependencies
        if: steps.payload.outputs.apply == 'true'
        run: composer audit --no-interaction

      - name: Tests and coverage
        if: steps.payload.outputs.apply == 'true'
        run: composer test:coverage

      - name: Commit validated changes
        if: steps.payload.outputs.apply == 'true'
        run: |
          git show origin/main:composer.json > composer.json
          rm -rf .github/hardening
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deepen Env Guard correctness and scanner coverage"
          git push origin HEAD:agent/deep-env-audit-hardening
